spring:
  application:
    name: wx-notion
  datasource:
    url: jdbc:h2:mem:wxdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  sql:
    init:
      mode: always
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
server:
  port: 8080

wx:
  appId: ${WX_APP_ID:wx008e59f6858bba86}
  secret: ${WX_APP_SECRET:your-app-secret}
  token: ${WX_TOKEN:your-token}
  encodingAesKey: ${WX_ENCODING_AES_KEY}
  # OAuth 网页授权回调基地址（可选，部署到公网后建议显式配置）
  oauthCallbackBase: ${WX_OAUTH_CALLBACK_BASE:https://wx.api.soloship.top}
  # OAuth 回调后跳转地址（前端页面）
  oauthReturnUrl: ${WX_OAUTH_RETURN_URL:https://wx.soloship.top}
  # 授权范围：snsapi_base(仅 openId) / snsapi_userinfo(需用户确认)
  oauthScope: ${WX_OAUTH_SCOPE:snsapi_userinfo}

security:
  aesKey: ${AES_KEY:0123456789abcdef0123456789abcdef}

jwt:
  secret: ${JWT_SECRET:changeme-changeme-changeme-changeme}

notion:
  version: ${NOTION_VERSION:2025-09-03}
  adminToken: ${NOTION_ADMIN_TOKEN:admin_token}
  guestRootPageId: ${NOTION_GUEST_ROOT_PAGE_ID:pageId}

ai:
  # 默认使用 SiliconFlow (硅基流动) 的 OpenAI 兼容接口
  # 注册地址: https://cloud.siliconflow.cn/ (送大量免费额度)
  base-url: ${AI_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${AI_API_KEY:sk-nrwjkfbettxrucgvtqmoupapbvopjzuqmfbqvebnvbpkhxsg}
  # 推荐模型: deepseek-ai/DeepSeek-V3, Qwen/Qwen2.5-7B-Instruct (免费)
  model: ${AI_MODEL:Pro/deepseek-ai/DeepSeek-V3}
